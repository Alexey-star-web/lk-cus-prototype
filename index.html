l class=\"fld\" for=\"login\">\n          <span class=\"fld__label\">Логин<\/span>\n          <input class=\"inp\" id=\"login\" name=\"login\" autocomplete=\"username\" placeholder=\"Например, ivanov\" spellcheck=\"false\">\n        <\/label>\n        <label class=\"fld\" for=\"password\">\n          <span class=\"fld__label\">Пароль<\/span>\n          <span class=\"control control--pw\">\n            <input class=\"inp\" id=\"password\" name=\"password\" type=\"password\" autocomplete=\"current-password\" placeholder=\"••••••••\">\n            <button type=\"button\" class=\"eye\" data-eye=\"password\" aria-label=\"Показать пароль\">\n              <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M1.8 10S4.6 4.4 10 4.4 18.2 10 18.2 10 15.4 15.6 10 15.6 1.8 10 1.8 10Z\"/><circle cx=\"10\" cy=\"10\" r=\"2.5\"/><\/svg>\n            <\/button>\n          <\/span>\n        <\/label>\n\n        <div class=\"alert\" id=\"authError\" role=\"alert\" hidden>\n          <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"8\"/><path d=\"M10 6.2v4.6M10 13.6v.01\"/><\/svg>\n          <span id=\"authErrorText\">Неверный логин или пароль.<\/span>\n        <\/div>\n\n        <button class=\"btn btn--primary\" id=\"loginBtn\" type=\"submit\">Начать работу<\/button>\n\n        <div class=\"actions\">\n          <button class=\"btn btn--ghost\" type=\"button\" id=\"toRegister\">Регистрация<\/button>\n          <button class=\"link\" type=\"button\" id=\"toRecover\">Восстановить пароль<\/button>\n        <\/div>\n      <\/form>\n\n      <!-- ============ регистрация ============ -->\n      <form id=\"regForm\" class=\"reg\" novalidate hidden>\n        <p class=\"reg__note\">Поля со <b>*<\/b> обязательны для заполнения<\/p>\n\n        <section class=\"regsec\">\n          <h3>Личные данные<\/h3>\n          <div class=\"formnote\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 2.5h7l3 3V17.5H5V2.5Z\"/><path d=\"M12 2.5v3h3M7.5 9h5M7.5 12h5M7.5 15h3\"/><\/svg><span>ФИО и должность будут автоматически подставляться в документы системы (акты, журналы и др.). Укажите их полностью, без сокращений — так, как они должны быть в документах.<\/span><\/div>\n          <div class=\"regrid\">\n            <label class=\"fld\" for=\"rSur\">\n              <span class=\"fld__label\">Фамилия <b class=\"req\">*<\/b><\/span>\n              <input class=\"inp\" id=\"rSur\" placeholder=\"Фамилия\" autocomplete=\"family-name\">\n              <span class=\"field-err\" id=\"rSurErr\" hidden><\/span>\n            <\/label>\n            <label class=\"fld\" for=\"rName\">\n              <span class=\"fld__label\">Имя <b class=\"req\">*<\/b><\/span>\n              <input class=\"inp\" id=\"rName\" placeholder=\"Имя\" autocomplete=\"given-name\">\n              <span class=\"field-err\" id=\"rNameErr\" hidden><\/span>\n            <\/label>\n            <label class=\"fld\" for=\"rPat\">\n              <span class=\"fld__label\">Отчество<\/span>\n              <input class=\"inp\" id=\"rPat\" placeholder=\"Отчество\" autocomplete=\"additional-name\">\n            <\/label>\n            <label class=\"fld\" for=\"rPos\">\n              <span class=\"fld__label\">Должность <b class=\"req\">*<\/b><\/span>\n              <input class=\"inp\" id=\"rPos\" placeholder=\"Например, инженер ПТО\">\n              <span class=\"field-err\" id=\"rPosErr\" hidden><\/span>\n            <\/label>\n            <label class=\"fld full\" for=\"rMail\">\n              <span class=\"fld__label\">Email <b class=\"req\">*<\/b><\/span>\n              <input class=\"inp\" id=\"rMail\" type=\"email\" placeholder=\"mail@domain.ru\" autocomplete=\"email\" spellcheck=\"false\">\n              <span class=\"fld__hint\">Рабочая почта. На неё придёт ссылка для восстановления пароля<\/span>\n              <span class=\"field-err\" id=\"rMailErr\" hidden><\/span>\n            <\/label>\n          <\/div>\n        <\/section>\n\n        <section class=\"regsec\">\n          <h3>Организация<\/h3>\n          <div class=\"regrid\">\n            <label class=\"fld\" for=\"rInn\">\n              <span class=\"fld__label\">ИНН организации <b class=\"req\">*<\/b><\/span>\n              <input class=\"inp\" id=\"rInn\" inputmode=\"numeric\" placeholder=\"10 или 12 цифр\" autocomplete=\"off\">\n              <span class=\"fld__hint\">Например, 9729306650 — название и КПП подставятся сами<\/span>\n              <span class=\"field-err\" id=\"rInnErr\" hidden><\/span>\n            <\/label>\n            <label class=\"fld\" for=\"rKpp\">\n              <span class=\"fld__label\">КПП<\/span>\n              <input class=\"inp\" id=\"rKpp\" readonly placeholder=\"Подставится по ИНН\">\n            <\/label>\n            <label class=\"fld full\" for=\"rOrg\">\n              <span class=\"fld__label\">Организация<\/span>\n              <input class=\"inp\" id=\"rOrg\" readonly placeholder=\"Подставится по ИНН\">\n            <\/label>\n          <\/div>\n          <div class=\"formnote\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 2.6 17 6v8l-7 3.4L3 14V6l7-3.4Z\"/><path d=\"M10 10v7.4M3 6l7 4 7-4\"/><\/svg><span>Организация и КПП подставятся по ИНН автоматически. Если организация не находится — проверьте цифры или обратитесь к администратору кабинета.<\/span><\/div>\n\n        <\/section>\n\n        <section class=\"regsec\">\n          <h3>Данные для входа<\/h3>\n          <div class=\"regrid\">\n            <label class=\"fld full\" for=\"rLogin\">\n              <span class=\"fld__label\">Логин <b class=\"req\">*<\/b> <span class=\"fld__hint\">латиница, цифры, точка<\/span><\/span>\n              <input class=\"inp\" id=\"rLogin\" autocomplete=\"username\" placeholder=\"ivanov\" spellcheck=\"false\">\n              <span class=\"field-err\" id=\"rLoginErr\" hidden><\/span>\n            <\/label>\n            <div class=\"fld\">\n              <label class=\"fld__label\" for=\"rPass\">Пароль <b class=\"req\">*<\/b><\/label>\n              <span class=\"control control--pw\">\n                <input class=\"inp\" id=\"rPass\" type=\"password\" autocomplete=\"new-password\" placeholder=\"Минимум 8 символов\">\n                <button type=\"button\" class=\"eye\" data-eye=\"rPass\" aria-label=\"Показать пароль\">\n                  <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M1.8 10S4.6 4.4 10 4.4 18.2 10 18.2 10 15.4 15.6 10 15.6 1.8 10 1.8 10Z\"/><circle cx=\"10\" cy=\"10\" r=\"2.5\"/><\/svg>\n                <\/button>\n              <\/span>\n              <div class=\"strength\" id=\"strength\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n              <div class=\"strength-note\"><span id=\"strengthText\">8+ символов, заглавная и цифра<\/span><span><\/span><\/div>\n              <span class=\"field-err\" id=\"rPassErr\" hidden><\/span>\n            <\/div>\n            <label class=\"fld\" for=\"rPass2\">\n              <span class=\"fld__label\">Повторите пароль <b class=\"req\">*<\/b><\/span>\n              <input class=\"inp\" id=\"rPass2\" type=\"password\" autocomplete=\"new-password\" placeholder=\"Ещё раз\">\n              <span class=\"field-err\" id=\"rPass2Err\" hidden><\/span>\n            <\/label>\n          <\/div>\n        <\/section>\n\n        <label class=\"check\" for=\"rOffer\">\n          <input type=\"checkbox\" id=\"rOffer\">\n          <span>Принимаю <button type=\"button\" class=\"link\" data-modal=\"offer\">договор оферты<\/button> и правила обработки данных<\/span>\n        <\/label>\n        <span class=\"field-err\" id=\"rOfferErr\" hidden><\/span>\n\n        <button class=\"btn btn--primary\" id=\"regBtn\" type=\"submit\">Зарегистрироваться<\/button>\n      <\/form>\n\n      <!-- ============ восстановление пароля ============ -->\n      <div id=\"recoverView\" hidden>\n        <form id=\"recForm\" novalidate>\n          <label class=\"fld\" for=\"recLogin\">\n            <span class=\"fld__label\">Логин<\/span>\n            <input class=\"inp\" id=\"recLogin\" autocomplete=\"username\" placeholder=\"ivanov.ii\" spellcheck=\"false\">\n            <span class=\"field-err\" id=\"recLoginErr\" hidden><\/span>\n          <\/label>\n          <label class=\"fld\" for=\"recMail\">\n            <span class=\"fld__label\">Электронная почта<\/span>\n            <input class=\"inp\" id=\"recMail\" type=\"email\" autocomplete=\"email\" placeholder=\"i.ivanov@stroy-invest.ru\" spellcheck=\"false\">\n            <span class=\"field-err\" id=\"recMailErr\" hidden><\/span>\n          <\/label>\n          <button class=\"btn btn--primary\" id=\"recBtn\" type=\"submit\">Отправить ссылку<\/button>\n        <\/form>\n        <div class=\"divider\"><\/div>\n        <div class=\"rec-links\">\n          <button class=\"switch__link\" type=\"button\" id=\"toHelp\">Не помню логин или нет доступа к почте<\/button>\n          <button class=\"back\" type=\"button\" id=\"recBack\">← Вернуться ко входу<\/button>\n        <\/div>\n      <\/div>\n\n\n      <!-- ============ не помню логин ============ -->\n      <div id=\"helpView\" hidden>\n        <p class=\"help-p\">Если вы не помните логин, допустили ошибку в логине при регистрации, не указали почту или потеряли к ней доступ — напишите в поддержку.<\/p>\n        <div class=\"helpnote\">\n          <b>Укажите в письме:<\/b>\n          <ul>\n            <li>ФИО<\/li>\n            <li>организацию<\/li>\n            <li>базу, в которой работаете<\/li>\n          <\/ul>\n        <\/div>\n        <p class=\"help-p\">Поддержка проверит ваше право на доступ с участием администратора вашей организации.<\/p>\n        <a class=\"btn btn--primary\" href=\"mailto:help@tsus.ru\">Написать на help@tsus.ru<\/a>\n        <div class=\"help-links\">\n          <button class=\"switch__link\" type=\"button\" id=\"helpBack\">← К восстановлению пароля<\/button>\n          <button class=\"back\" type=\"button\" id=\"helpLogin\">Ко входу<\/button>\n        <\/div>\n      <\/div>\n\n      <div id=\"recDone\" hidden>\n        <div class=\"done\">\n          <span class=\"done__ic\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 10.5l4 4 8-9\"/><\/svg><\/span>\n          <b>Ссылка отправлена<\/b>\n          <span id=\"recDoneText\"><\/span>\n        <\/div>\n        <button class=\"btn btn--primary\" type=\"button\" id=\"recBack2\">Вернуться ко входу<\/button>\n      <\/div>\n    <\/section>\n\n    <p class=\"switch\" id=\"loginSwitch\" hidden>Уже есть аккаунт? <button class=\"switch__link\" type=\"button\" id=\"toLogin\">Войти<\/button><\/p>\n    <p class=\"switch\" id=\"supportLine\" hidden>Техподдержка: <a class=\"switch__link\" href=\"mailto:help@tsus.ru\">help@tsus.ru<\/a><\/p>\n  <\/main>\n<\/div>\n\n<div class=\"scrim\" id=\"scrim\" hidden><\/div>\n\n<!-- восстановление пароля -->\n<!-- договор оферты -->\n<div class=\"modal\" id=\"offerModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"offerTitle\" hidden>\n  <div class=\"modal__head\">\n    <div>\n      <h3 id=\"offerTitle\">Договор оферты<\/h3>\n      <p>Редакция от 01.11.2026 · применяется к использованию ЛК ЦУС.<\/p>\n    <\/div>\n    <button class=\"x\" type=\"button\" data-close aria-label=\"Закрыть\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4.5 4.5l11 11M15.5 4.5l-11 11\"/><\/svg><\/button>\n  <\/div>\n  <div class=\"modal__body\">\n    <div class=\"offer\">\n      <h4>1. Предмет<\/h4>\n      <p>Исполнитель предоставляет доступ к личному кабинету ЦУС — рабочему пространству для заявок на объекты, счетов, договоров и документов организации.<\/p>\n      <h4>2. Регистрация<\/h4>\n      <p>Для начала работы пользователь создаёт учётную запись: указывает логин, пароль и контакт для восстановления доступа. Пользователь отвечает за сохранность пароля и достоверность контактных данных.<\/p>\n      <h4>3. Порядок работы<\/h4>\n      <p>Доступ предоставляется после авторизации. Пользователь вправе формировать документы, сохранять результаты и использовать их в собственной деятельности без ограничений по объёму.<\/p>\n      <h4>4. Персональные данные<\/h4>\n      <p>Обрабатываются только данные, необходимые для авторизации и восстановления доступа: логин, контакт, технические журналы. Данные не передаются третьим лицам, кроме случаев, предусмотренных законом.<\/p>\n      <h4>5. Ответственность<\/h4>\n      <p>Исполнитель обеспечивает работоспособность сервиса и сохранность учётных данных, но не несёт ответственности за содержание документов, сформированных пользователем, и за последствия их применения.<\/p>\n      <h4>6. Изменения<\/h4>\n      <p>Актуальная редакция договора всегда доступна в этом окне. Продолжение работы после изменений означает согласие с новой редакцией.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"modal__foot\">\n    <button class=\"btn btn--ghost btn--sm\" type=\"button\" data-close>Понятно<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\" hidden role=\"status\"><\/div>\n\n<script>\n(function () {\n  \"use strict\";\n  if (window.self !== window.top) document.body.classList.add(\"is-framed\");\n  const $ = (s, r) => (r || document).querySelector(s);\n  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));\n\n  const loginForm = $(\"#loginForm\"), regForm = $(\"#regForm\");\n  const title = $(\"#formTitle\"), sub = $(\"#formSub\"), kicker = $(\"#kicker\");\n  const authError = $(\"#authError\"), authErrorText = $(\"#authErrorText\");\n  const scrim = $(\"#scrim\");\n  const toastEl = $(\"#toast\");\n  let toastT;\n\n  function toast(t) {\n    toastEl.textContent = t;\n    toastEl.hidden = false;\n    clearTimeout(toastT);\n    toastT = setTimeout(() => { toastEl.hidden = true; }, 3200);\n  }\n\n  /* ---------- переключение вход / регистрация ---------- */\n  function view(name) {\n    const reg = name === \"register\", rec = name === \"recover\", help = name === \"help\";\n    loginForm.hidden = reg || rec || help;\n    regForm.hidden = !reg;\n    $(\"#recoverView\").hidden = !rec;\n    $(\"#helpView\").hidden = !help;\n    $(\"#recDone\").hidden = true;\n    $(\"#loginSwitch\").hidden = !reg;\n    $(\"#supportLine\").hidden = !(rec || help);\n    document.querySelector(\".authcard\").classList.toggle(\"authcard--wide\", reg);\n    document.querySelector(\".stage\").classList.toggle(\"stage--reg\", reg);\n    authError.hidden = true;\n    title.textContent = rec ? \"Восстановление пароля\" : help ? \"Не помню логин или нет доступа к почте\" : reg ? \"Создание аккаунта\" : \"Вход в кабинет\";\n    sub.hidden = reg || help;\n    sub.textContent = rec\n      ? \"Укажите логин и основную почту из вашего профиля. Мы отправим на неё ссылку для установки нового пароля.\"\n      : reg ? \"\" : \"Используйте учётную запись ЛК ЦУС.\";\n    kicker.textContent = (rec || help) ? \"Восстановление доступа\" : reg ? \"Регистрация\" : \"Авторизация\";\n    const first = rec ? $(\"#recLogin\") : reg ? $(\"#rLogin\") : $(\"#login\");\n    setTimeout(() => first.focus({ preventScroll: true }), 40);\n  }\n  $(\"#toRegister\").addEventListener(\"click\", () => view(\"register\"));\n  $(\"#toLogin\").addEventListener(\"click\", () => view(\"login\"));\n\n  /* ---------- показать пароль ---------- */\n  $$(\"[data-eye]\").forEach(btn => {\n    btn.addEventListener(\"click\", () => {\n      const input = document.getElementById(btn.dataset.eye);\n      const show = input.type === \"password\";\n      input.type = show ? \"text\" : \"password\";\n      btn.setAttribute(\"aria-label\", show ? \"Скрыть пароль\" : \"Показать пароль\");\n      btn.style.color = show ? \"var(--accent)\" : \"\";\n    });\n  });\n\n  /* ---------- ошибки полей ---------- */\n  function setErr(input, id, msg) {\n    const el = document.getElementById(id);\n    if (msg) { el.textContent = msg; el.hidden = false; input.classList.add(\"err\"); input.setAttribute(\"aria-invalid\", \"true\"); }\n    else { el.hidden = true; input.classList.remove(\"err\"); input.removeAttribute(\"aria-invalid\"); }\n  }\n  $$(\".inp\").forEach(i => i.addEventListener(\"input\", () => {\n    i.classList.remove(\"err\");\n    i.removeAttribute(\"aria-invalid\");\n    const e = i.closest(\".fld\") && i.closest(\".fld\").querySelector(\".field-err\");\n    if (e) e.hidden = true;\n  }));\n\n  /* ---------- вход ---------- */\n  loginForm.addEventListener(\"submit\", e => {\n    e.preventDefault();\n    const login = $(\"#login\"), pass = $(\"#password\");\n    if (!login.value.trim() || !pass.value) {\n      authErrorText.textContent = \"Введите логин и пароль.\";\n      authError.hidden = false;\n      if (!login.value.trim()) login.classList.add(\"err\");\n      if (!pass.value) pass.classList.add(\"err\");\n      return;\n    }\n    const btn = $(\"#loginBtn\");\n    authError.hidden = true;\n    btn.disabled = true; btn.textContent = \"Проверяем…\";\n    setTimeout(() => {\n      btn.disabled = false; btn.textContent = \"Начать работу\";\n      authErrorText.textContent = \"Неверный логин или пароль. Проверьте раскладку и регистр.\";\n      authError.hidden = false;\n      pass.select();\n    }, 900);\n  });\n\n  /* ---------- сила пароля ---------- */\n  const strength = $(\"#strength\"), strengthText = $(\"#strengthText\");\n  $(\"#rPass\").addEventListener(\"input\", e => {\n    const v = e.target.value;\n    let score = 0;\n    if (v.length >= 8) score++;\n Val)) { setErr(inn, \"rInnErr\", \"ИНН — 10 цифр для организации или 12 для ИП.\"); ok = false; }\n    else if (!ORGS[innVal]) { setErr(inn, \"rInnErr\", \"Организация с таким ИНН не найдена в ЕГРЮЛ. Проверьте цифры.\"); ok = false; }\n    else setErr(inn, \"rInnErr\");\n\n    if (!/^[A-Za-z0-9._-]{3,}$/.test(l.value.trim())) { setErr(l, \"rLoginErr\", \"Минимум 3 символа: латиница, цифры, точка, дефис.\"); ok = false; } else setErr(l, \"rLoginErr\");\n    if (p.value.length < 8 || !/[A-ZА-Я]/.test(p.value) || !/\\d/.test(p.value)) { setErr(p, \"rPassErr\", \"Нужно 8+ символов, заглавная буква и цифра.\"); ok = false; } else setErr(p, \"rPassErr\");\n    if (p2.value !== p.value || !p2.value) { setErr(p2, \"rPass2Err\", \"Пароли не совпадают.\"); ok = false; } else setErr(p2, \"rPass2Err\");\n\n    const oe = $(\"#rOfferErr\");\n    if (!o.checked) { oe.textContent = \"Нужно принять договор оферты.\"; oe.hidden = false; o.classList.add(\"err\"); ok = false; }\n    else { oe.hidden = true; o.classList.remove(\"err\"); }\n    if (!ok) return;\n\n    const btn = $(\"#regBtn\");\n    btn.disabled = true; btn.textContent = \"Создаём аккаунт…\";\n    setTimeout(() => {\n      btn.disabled = false; btn.textContent = \"Зарегистрироваться\";\n      toast(\"Аккаунт создан. Войдите с новым логином.\");\n      view(\"login\");\n      $(\"#login\").value = l.value.trim();\n      $(\"#password\").focus();\n    }, 900);\n  });\n\n  /* ---------- модальные окна ---------- */\n  let lastFocus = null;\n  function openModal(id) {\n    lastFocus = document.activeElement;\n    scrim.hidden = false;\n    const m = document.getElementById(id);\n    m.hidden = false;\n    const focusable = m.querySelector(\"input,button\");\n    if (focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 30);\n  }\n  function closeModal() {\n    scrim.hidden = true;\n    $$(\".modal\").forEach(m => { m.hidden = true; });\n    if (lastFocus && lastFocus.isConnected) lastFocus.focus({ preventSc   S.invs.filter(i => i.cab === S.cab && !i.req && ["issued", "rejected"].includes(i.status)).forEach(i => todo.push(["", `Оплатите продление по счёту ${i.id}`, `${esc(i.obj)}, ${i.months} мес. — ${sumTxt(i)}`, `<button class="btn pri sm" data-paymodal="${i.id}">Прикрепить платёж</button>`]));

  const nearFill = near === null ? 0 : Math.max(0, Math.min(30, near));
  const ticks = Array.from({ length: 30 }, (_, i) => `<i class="${i < nearFill ? "on" : ""}"></i>`).join("");
  const mgr = m
    ? `<div class="ov-mgr-h"><div class="ov-ava" aria-hidden="true">${m.ini}</div><div class="tx"><span class="ov-note">Ваш менеджер в Осмокоде</span><b>${esc(m.name)}</b></div><button class="ov-arrow" data-chat="open" aria-label="Написать менеджеру">${I.chat}</button></div>
       <p class="ov-note" style="margin-top:10px">Ведёт заявки и договоры вашей организации</p>
       <div class="ov-mgr-c"><a href="tel:${m.phone.replace(/[^+\d]/g, "")}">${esc(m.phone)}</a><a href="mailto:${m.email}">${esc(m.email)}</a></div>`

      </div>
      <div>
        <div class="ov-hero-legend">
          <div><span><i class="ld s1"></i>Доступ включён</span><b>${activeN}<em>${objs.length ? Math.round(activeN / objs.length * 100) : 0}%</em></b></div>
          <div><span><i class="ld s2"></i>Истекает ≤ 30 дней</span><b>${soonN}<em>${objs.length ? Math.round(soonN / objs.length * 100) : 0}%</em></b></div>
          <div><span><i class="ld s3"></i>Закрыт</span><b>${closedN}<em>${objs.length ? Math.round(closedN / objs.length * 100) : 0}%</em></b></div>

      <div>
        <div class="ov-big"><b>${todo.length}</b><span>${plural(todo.length, "задача", "задачи", "задач")}</span></div>

      ${todo.length ? `<div class="ov-todo">${todo.slice(0, 6).map(([mk, t, d, a]) => `<div class="ov-ti"><span class="dot ${mk}"></span><div class="tx"><b>${t}</b><span>${d}</span></div>${a}</div>`).join("")}</div><div class="ov-foot"><span class="ov-note">${todo.length > 6 ? `Показаны 6 из ${todo.length}` : "Данные на " + fmtDate(TODAY)}</span><button class="btn ghost sm" data-go="requests">Все задачи ${I.arr}</button></div>` : `<div class="empty"><b>Всё сделано</b>Новые задачи появятся, когда заявка перейдёт к вам.</div>`}

</div>`;

function whoWaits(r) {

}

  </div>`;

const INV_ST = { issued: ["Ожидает оплаты", "wait"], check: ["Платёж на проверке", "acc"], paid: ["Оплачен", "ok"], rejected: ["Платёж отклонён", "dng"] };
/* ---------- скидки по счёту ---------- */
const DISC_WHY = ["Объём: несколько объектов по договору", "Продление без перерыва", "Компенсация за задержку подключения", "Пилот / первый объект", "Другое"];
const discAmt = (i, base = i.base ?? i.sum) => !i.disc ? 0 : i.disc.kind === "pct" ? Math.round(base * i.disc.val / 100) : Math.min(i.disc.val, base);
const discLbl = i => i.disc ? (i.disc.kind === "pct" ? `−${i.disc.val}%` : `−${fmtMoney(discAmt(i))}`) : "";
function invSetBase(i, base) { i.base = base; i.sum = base - discAmt(i, base); }

const sumTxt = i => fmtMoney(i.sum) + (i.disc ? ` (скидка ${discLbl(i)})` : "");
const canEditInv = i => ["issued", "rejected"].includes(i.status) && (isMine(i.cab) || !S.cabs[i.cab].mgr);

  <div class="mb"><div class="form">

function vObjects() {

function scopeHTML(page, count) {

   <section class="card req-table">${rows.length ? `<div class="tw"><table data-tkey="a-req-${S.flow}"><thead><tr><th>Заявка</th><th>Клиент</th><th>Менеджер</th><th>Объект</th><th>Этап</th><th class="num">На этапе</th><th></th></tr></thead><tbody>${rows.map(r => { const ds = daysSince(r.upd); return `<tr class="click" data-open="${r.id}"><td><b>${r.id}</b><span class="t2">${TYPES[r.type].t}</span></td><td>${esc(cab(r.cab).name)}<span class="t2">ИНН ${cab(r.cab).inn}</span></td>${mgrCell(r.cab)}<td>${esc(r.obj)}<span class="t2">${WORK[r.work]} · ${fmtAmt(r.cost)} ₽</span></td><td><div class="stagecell">${miniHTML(r)}${chip(r)}</div></td><td class="num" data-s="${ds}">${ds ? ds + " " + plural(ds, "день", "дня", "дней") : "сегодня"}${r.type === "isup" && r.stage === "external" && ds > 14 ? `<span class="t2" style="color:var(--danger-text)">дольше 14 дней</span>` : ""}</td><td class="num">${reqBtn(r)}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty"><b>На этом этапе заявок нет</b>Выберите другой этап выше.</div>`}</section></div>`;

const ivMode = () => document.querySelector("[data-ivmode][aria-pressed=true]").dataset.ivmode;

const ivMails = () => val("iv-mails").split(/[\s,;]+/).filter(Boolean);
function ivUntil() {

  const now = new Date(TODAY); const n = new Date(); now.setHours(n.getHours(), n.getMinutes()); now.setDate(now.getDate() + +e); return now;
}
function ivSum() {

  box.innerHTML = `<div><b>${who}</b><span class="note" style="display:block">${IV_ROLES[role]}, ${esc(val("iv-sys"))} · ${all ? "все объекты кабинета" : sel + " " + plural(sel, "объект", "объекта", "объектов")}</span></div><div style="text-align:right"><span class="note">Действует до</span><div><b>${until && !isNaN(until) ? fmtDT(until) : "—"}</b></div></div>`;

function ivSend() {

  let mails = [];
  if (mode === "mail") { mails = ivMails(); if (!mails.length) err("iv-mails", "Укажите хотя бы один e-mail."); const bad = mails.filter(m => !RE_MAIL.test(m)); if (bad.length) err("iv-mails", "Проверьте адрес: " + bad.join(", ") + "."); const dup = mails.filter(m => (S.users[k] || []).some(u => u.email === m)); if (dup.length) err("iv-mails", "Уже есть в кабинете: " + dup.join(", ") + "."); }
  else if (!document.getElementById("iv-unl").checked && !(+val("iv-cnt") >= 1)) err("iv-cnt", "Укажите, сколько человек может зарегистрироваться.");

  let org = "";
  if (role === "guest") { org = GUEST_ORGS[val("iv-ginn")]; if (!org) err("iv-ginn", /^\d{10}(\d{2})?$/.test(val("iv-ginn")) ? "Организация с таким ИНН не найдена." : "Укажите ИНН организации подрядчика."); }
  const allObj = ivObjMode() === "all";
  const objs = [...document.querySelectorAll("[data-ivo]:checked")].map(x => S.objs.find(o => o.id === x.dataset.ivo).name);
  if (!allObj && !objs.length) errs.push("Отметьте хотя бы один объект.");
  if (role === "guest" && allObj) errs.push("Подрядчику-гостю откройте только выбранные объекты.");
  if (errs.length) { document.getElementById("iv-err").innerHTML = `<div class="alert a-crit">${I.warn}<span>${errs.join(" ")}</span></div>`; document.getElementById("iv-err").scrollIntoView({ block: "nearest" }); return; }
  const groups = [...document.querySelectorAll("[data-grp][aria-pressed=true]")].map(b => b.dataset.grp);
  const objRoles = {}; document.querySelectorAll("[data-pers]").forEach(sl => { const cb = document.querySelector(`[data-ivo="${sl.dataset.pers}"]`); if ((allObj || (cb && cb.checked)) && sl.value !== "Без роли") objRoles[sl.dataset.pers] = sl.value; });
  const base = { role: IV_ROLES[role], sys: val("iv-sys"), groups, org, objs: allObj ? null : objs, objRoles, until };
  if (mode === "mail") {
    mails.forEach(m => (S.users[k] = S.users[k] || []).push({ ...base, name: "", email: m, status: "invited", sent: TODAY }));

  } else {

    const max = document.getElementById("iv-unl").checked ? Infinity : +val("iv-cnt");

}

    : `<input class="inp ${e ? "err" : ""}" id="${id}" type="${o.type || "text"}" value="${esc(v)}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ""}${o.ac ? ` autocomplete="${o.ac}"` : ""}${o.im ? ` inputmode="${o.im}"` : ""}${o.dis ? " disabled" : ""}${aria}>`;
  return `<div class="field ${o.full ? "full" : ""}"><label for="${id}" class="${o.req ? "req" : ""}">${label}</label>${ctl}${e ? `<span class="errt" id="${id}-e">${e}</span>` : o.hint ? `<span class="hint">${o.hint}</span>` : ""}</div>`;

function invAction(a) {

/* ---------- деньги ---------- */
const recvDate = i => i.status === "paid" ? pDate(i.pp?.date) || i.date : null;
function overlap(a1, a2, b1, b2) { const s = Math.max(a1, b1), e = Math.min(a2, b2); return Math.max(0, (e - s) / 864e5 + 1); }
function accrued(i, a, b) { if (i.status !== "paid" || !i.from || !i.to) return 0; const tot = (i.to - i.from) / 864e5 + 1; return tot > 0 ? i.sum * overlap(i.from.getTime(), i.to.getTime(), a.getTime(), b.getTime()) / tot : 0; }
function money(invs, P) {
  const inP = d => d && d >= P.from && d <= P.to;
  const issued = invs.filter(i => inP(i.date)).reduce((a, i) => a + i.sum, 0);
  const recv = invs.filter(i => inP(recvDate(i))).reduce((a, i) => a + i.sum, 0);
  const acc = invs.reduce((a, i) => a + accrued(i, P.from, P.to), 0);
  const upTo = P.to < TODAY ? P.to : TODAY;
  const adv = invs.filter(i => i.status === "paid" && recvDate(i) <= upTo).reduce((a, i) => a + i.sum - accrued(i, new Date(2000, 0, 1), upTo), 0);
  const nRecv = invs.filter(i => inP(recvDate(i))).length;
  return { issued, recv, acc, adv: Math.max(0, adv), avg: nRecv ? recv / nRecv : 0, nRecv };
}
function monthly(invs, P, mode) {
  const ks = []; for (let k = mKey(P.from); k <= mKey(P.to) && ks.length < 25; k++) ks.push(k);
  return ks.map(k => {
    const a = new Date(Math.floor(k / 12), k % 12, 1), b = new Date(Math.floor(k / 12), k % 12 + 1, 0);
    const v = mode === "period" ? invs.reduce((s, i) => s + accrued(i, a, b), 0) : invs.filter(i => { const d = recvDate(i); return d && mKey(d) === k; }).reduce((s, i) => s + i.sum, 0);
    const iss = invs.filter(i => mKey(i.date) === k).reduce((s, i) => s + i.sum, 0);
    return { k, v, iss };
  });
}

/* ---------- графики ---------- */
function barsSVG(data, opts = {}) {
  const W = 640, H = 220, L = 56, R = 8, T = 12, Bm = 26, n = data.length || 1;
  const rawMax = Math.max(1, ...data.map(d => Math.max(d.v, opts.line ? d.iss : 0)));
  const pow = Math.pow(10, Math.floor(Math.log10(rawMax)));
  const mult = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(m => rawMax / pow <= m) || 10;
  const max = mult * pow;
  const step = (W - L - R) / n, bw = Math.min(28, step * .56), y = v => T + (H - T - Bm) * (1 - v / (max * 1.08));
  const ticks = [0, .5, 1].map(f => max * f);
  const short = v => v >= M ? (v / M).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " млн" : v >= 1000 ? Math.round(v / 1000) + " тыс" : Math.round(v) + "";
  const line = opts.line ? `<polyline fill="none" stroke="var(--chart-2)" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" points="${data.map((d, i) => `${L + step * i + step / 2},${y(d.iss)}`).join(" ")}"/>${data.map((d, i) => `<circle cx="${L + step * i + step / 2}" cy="${y(d.iss)}" r="3.2" fill="var(--chart-2)" stroke="var(--bg-page)" stroke-width="1.5"/>`).join("")}` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || "")}">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" class="ax">${short(t)}</text>`).join("")}
    ${data.map((d, i) => { const x = L + step * i + step / 2, h = H - Bm - y(d.v); return `<g class="hit"${opts.click ? ` data-mclick="${d.k}"` : ""}><rect x="${L + step * i}" y="${T}" width="${step}" height="${H - T - Bm}" fill="transparent"/>${d.v ? `<path d="M${x - bw / 2},${H - Bm} v${-Math.max(h - 4, 0)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${Math.max(h - 4, 0)} z" fill="var(--chart-1)"/>` : ""}<text x="${x}" y="${H - 8}" text-anchor="middle" class="ax">${mLbl(d.k)}</text><title>${mLbl(d.k)}: ${opts.vName || "получено"} ${fmtMoney(d.v)}${opts.line ? `, выставлено ${fmtMoney(d.iss)}` : ""}</title></g>`; }).join("")}
    ${line}</svg>`;
}
function divSVG(data) {
  const W = 640, H = 220, L = 36, R = 8, T = 10, Bm = 24, n = data.length || 1, max = Math.max(1, ...data.map(d => Math.max(d.up, d.down)));
  const mid = T + (H - T - Bm) / 2, k = (H - T - Bm) / 2 / max, step = (W - L - R) / n, bw = Math.min(26, step * .5);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Новые и ушедшие клиенты по месяцам">

  const t = e.target.closest("button, a, tr[data-open], tr[data-card], [data-close]");

  if (t.tagName === "A") e.preventDefault();
  if (d.close !== undefined && (t.classList.contains("scrim") ? e.target === t : true)) { closeLayer(); return; }
  if (d.role) { S.role = d.role; closeLayer(); render(); scrollTo(0, 0); return; }
  if (d.go) { closeLayer(); if (S.role === "client") S.scr = d.go; else S.adm = d.go; render(); scrollTo(0, 0); return; }
  if (d.toast) { toast(d.toast); return; }
  if (d.card) { if (t.tagName === "TR" && e.target.closest("button") && e.target.closest("button") !== t) return; const ci = d.card.indexOf(":"); openCard(d.card.slice(0, ci), d.card.slice(ci + 1), !!t.closest("#layer")); return; }
  if (d.cardback !== undefined) { CARD.pop(); renderCard(); return; }
  if (d.ctab) { CARD[CARD.length - 1][2] = d.ctab; renderCard(); return; }
  if (d.open) { if (t.tagName === "TR" && e.target.closest("button") && e.target.closest("button") !== t) return; openReq(d.open); return; }
  if (d.reqf) { S.reqF = d.reqf; render(); return; }
  if (d.flow) { S.flow = d.flow; render(); return; }
  if (d.wz) { openWizard(d.wz); return; }
  if (d.edit) { const r = reqBy(d.edit); openWizard(r.type, r); return; }
  if (d.copy) { const r = reqBy(d.copy); openWizard(r.type, { ...r, id: null }); return; }
  if (d.cancel) { const r = reqBy(d.cancel); if (r.stage === "draft") { S.reqs = S.reqs.filter(x => x !== r); closeLayer(); render(); toast("Черновик удалён"); return; } r.failAt = r.stage === "returned" ? r.failAt : r.stage; r.stage = "cancelled"; r.upd = TODAY; r.log.push([TODAY, "Вы", "Заявка отменена"]); reopen(r.id); toast(`Заявка ${r.id} отменена`); return; }
  if (d.resend) { const r = reqBy(d.resend); r.busErr = false; r.upd = TODAY; r.log.push([TODAY, "Вы", "Отправлена повторно"]); reopen(r.id); toast("Заявка отправлена повторно"); return; }
  if (d.sendpay) { sendPay(d.sendpay); return; }
  if (d.paymodal) { payModal(d.paymodal); return; }
  if (d.renew) { renewModal(d.renew); return; }
  if (d.mkrenew) { const o = S.objs.find(x => x.id === d.mkrenew), g = grade(cab(o.cab).prog, o.work, o.cost), m = o.work === "pir" ? 12 : +(document.getElementById("rn-per")?.value || 3); const start0 = o.till > TODAY ? new Date(o.till.getTime() + 864e5) : TODAY; const inv = { id: "СЧ-0" + (S.invSeq++), cab: o.cab, contract: o.contract, objId: o.id, from: start0, to: addMonths(start0, o.work === "pir" ? 12 : m), obj: o.name, months: m, sum: g.price * (o.work === "pir" ? 1 : m), status: "issued", date: TODAY }; S.invs.unshift(inv); closeLayer(); S.scr = "invoices"; render(); toast(`Счёт ${inv.id} сформирован. Оплатите и прикрепите платёжное поручение.`); return; }
  if (d.payok) { confirmPay(d.payok); return; }
  if (d.payrej) { rejectPay(d.payrej); return; }
  if (d.pass) { const r = reqBy(d.pass); if (r.type === "isup") { r.stage = "external"; r.upd = TODAY; r.log.push([TODAY, "Осмокод", "Проверка пройдена, заявка передана в ИСУП (РКС № " + (4470 + S.seq) + ")"]); render(); closeLayer(); toast(`Заявка ${r.id} передана в ИСУП. Клиент видит, что ждём объект.`); } else { issueInvoice(r, "Осмокод", "Градация подтверждена"); render(); closeLayer(); toast(`Градация подтверждена, клиенту выставлен счёт.`); } return; }
  if (d.return) { const c = val("ret-c"); if (!c) { const el = document.getElementById("ret-c"); el.classList.add("err"); el.focus(); toast("Напишите клиенту, что исправить"); return; } const r = reqBy(d.return); r.failAt = "check"; r.stage = "returned"; r.comment = c; r.upd = TODAY; r.log.push([TODAY, "Осмокод", "Возвращена на доработку: " + c]); render(); closeLayer(); toast(`Заявка ${r.id} возвращена клиенту`); return; }
  if (d.reject) { const r = reqBy(d.reject); reasonModal("Отклонить заявку", r.stage === "external" ? ["ИСУП отказал в передаче объекта", "Контракт расторгнут"] : ["Контракт не найден в ЕИС", "Организация не является генподрядчиком по контракту", "Повторная заявка"], reason => { r.failAt = r.stage; r.stage = "rejected"; r.comment = reason; r.upd = TODAY; r.log.push([TODAY, "Осмокод", "Отклонена: " + reason]); closeLayer(); render(); toast(`Заявка ${r.id} отклонена`); }, "Отклонить заявку"); return; }
  if (d.got) { const r = reqBy(d.got); r.cost = num("obj-cost") || r.cost; r.code = val("obj-code"); issueInvoice(r, "Осмокод", "Объект получен из ИСУП"); render(); closeLayer(); toast("Объект получен. Клиенту выставлен счёт — начисления начнутся с оплаты."); return; }
  if (d.bus) { const r = reqBy(d.id); if (d.bus === "ok") { r.busErr = false; r.stage = "review"; r.log.push([TODAY, "L-Шина", "Доставлена в АСУ ТК–П-МКП"]); } else { r.busErr = true; r.log.push([TODAY, "L-Шина", "Ошибка передачи"]); } r.upd = TODAY; reopen(r.id); return; }
  if (d.cust) { const r = reqBy(d.id); if (d.cust === "ok") { issueInvoice(r, "Заказчик", "Подключение подтверждено, объект и участники загружены"); } else { r.failAt = "review"; r.stage = "rejected"; r.comment = d.cust === "role" ? "С этой ролью к объекту уже подключена другая ВИС. Обратитесь к заказчику." : "Заказчик отклонил подключение. Уточните у него причину."; r.log.push([TODAY, "Заказчик", "Отклонена"]); } r.upd = TODAY; reopen(r.id); return; }
  if (d.prepdoc) { prepDocModal(d.prepdoc); return; }
  if (d.take) { takeClient(d.take, d.takeopen); return; }
  if (d.scope) { const [pg, sc] = d.scope.split(":"); S.scope[pg] = sc; if (pg === "requests") S.flow = sc === "free" ? "check" : S.flow; render(); return; }
  if (d.mgrset) { mgrModal(d.mgrset); return; }
  if (d.mgrsave) { const k = d.mgrsave, c = S.cabs[k], v = document.querySelector("[name=mgr-new]:checked"); if (!v || v.value === c.mgr) { closeLayer(); return; } const from = c.mgr ? MANAGERS[c.mgr].short : "—"; c.mgr = v.value; c.mgrSince = TODAY; S.reqs.filter(r => r.cab === k && !isClosed(r)).forEach(r => r.log.push([TODAY, MANAGERS[S.me].short, `Клиент передан: ${from} → ${MANAGERS[c.mgr].short}`])); closeLayer(); render(); toast(`${c.name} передан менеджеру ${MANAGERS[c.mgr].short}`); return; }
  if (d.invcab) { inviteModal(d.invcab); return; }
  if (d.lnkRevoke) { S.links[S.cab] = S.links[S.cab].filter(x => x.token !== d.lnkRevoke); render(); toast("Ссылка отозвана — по ней больше нельзя зарегистрироваться"); return; }
  if (d.senddoc) { const c = S.cabs[d.senddoc]; c.prog = val("pd-prog"); c.doc = { id: "K" + (S.contracts.length + 1), cab: d.senddoc, kind: val("pd-kind"), num: (val("pd-kind") === "Договор" ? "Д" : "С") + "-2026/" + (140 + S.seq), date: fmtDate(TODAY), state: "sent", subject: val("pd-prog") === "saas" ? "Подписка ЦУС SaaS на собственные объекты" : "Лицензия ЦУС ВИС на объекты " + c.base, signed: "" }; S.contracts.push(c.doc); closeLayer(); render(); toast(`${c.doc.kind} отправлен${gnd(c.doc.kind)} на подпись ${c.name}`); return; }
  if (d.joinOk !== undefined || d.joinNo !== undefined) { const i = +(d.joinOk ?? d.joinNo), j = S.joins[S.cab].splice(i, 1)[0]; if (d.joinOk !== undefined) S.users[S.cab].push({ name: j.name, email: j.email, role: "Сотрудник", status: "active" }); render(); toast(d.joinOk !== undefined ? `${j.name} добавлена в кабинет` : "Запрос отклонён, пользователь получит письмо"); return; }
  if (d.uResend !== undefined) { const uu = S.users[S.cab][+d.uResend]; uu.sent = TODAY; uu.until = new Date(TODAY.getTime() + 7 * 864e5); render(); toast("Приглашение отправлено повторно, ссылка действует 7 дней"); return; }
  if (d.uRevoke !== undefined) { S.users[S.cab].splice(+d.uRevoke, 1); render(); toast("Приглашение отозвано, ссылка больше не работает"); return; }
  if (d.uToggle !== undefined) { const u = S.users[S.cab][+d.uToggle]; u.status = u.status === "off" ? "active" : "off"; render(); toast(u.status === "off" ? "Пользователь отключён" : "Пользователь включён"); return; }
  const a = d.act; if (!a) return;
  if (formAction(a, t)) return;
  if (a === "navtog") { NAVMINI = !NAVMINI; try { localStorage.setItem("lk4-nav-mini", NAVMINI ? "1" : "0"); } catch (_) {} render(); return; }
  if (a === "new-req") openWizard();
  if (a === "wz-back") openWizard();
  if (a === "wz-send") wzSave(true);
  if (a === "wz-draft") wzSave(false);
  if (a === "invite") inviteModal();
  if (a === "iv-send") ivSend();

  if (a === "sign-doc") { const c = cab(); c.doc.state = "signed"; c.doc.signed = (S.users[S.cab][0] || {}).name + ", " + fmtDate(TODAY); if (CARD.length) { render(); renderCard(); toast(`${c.doc.kind} подписан${gnd(c.doc.kind)} ЭП.`); return; } render(); toast(`${c.doc.kind} подписан${gnd(c.doc.kind)} ЭП. Заявки уйдут во внешние системы.`); }
  if (a === "sign-acts") { S.acts.filter(x => x.cab === S.cab && x.status === "osm").forEach(x => x.status = "signed"); render(); toast("Документы подписаны ЭП"); }
});
document.addEventListener("change", e => {
  if (e.target.id === "r-kpp") { S.reg.v["r-kpp"] = e.target.value; S.reg.e = {}; render(); return; }
  if (/^[ri]-nopat$/.test(e.target.id)) { const p = e.target.id[0]; document.getElementById(p + "-pat").disabled = e.target.checked; sigName(p, p === "r" ? S.reg.found.name : "ООО «ТКР»"); return; }
  if (e.target.id === "mesel") { S.me = e.target.value; closeLayer(); render(); toast("Вы — " + MANAGERS[S.me].name + ". «Мои клиенты» показывают его клиентов"); return; }
  if (e.target.id === "cabsel") { S.cab = e.target.value; S.scr = "overview"; render(); }
});
document.addEventListener("click", e => {
  const dbtn = e.target.closest("#demoBtn");
  if (dbtn) {
    const p = document.getElementById("demoPanel");
    p.hidden = !p.hidden;
    dbtn.setAttribute("aria-expanded", String(!p.hidden));
    return;
  }
  if (!e.target.closest("#demoPanel")) {
    const p = document.getElementById("demoPanel");
    if (p && !p.hidden) { p.hidden = true; const b = document.getElementById("demoBtn"); if (b) b.setAttribute("aria-expanded", "false"); }
  }
  const hamb = e.target.closest("#hamb");
  if (hamb) {
    const top = document.querySelector(".top");
    const open = top.classList.toggle("menuopen");
    hamb.setAttribute("aria-expanded", String(open));
    return;
  }
  if (e.target.id === "hscrim") {
    const top = document.querySelector(".top"); top.classList.remove("menuopen");
    const h = document.getElementById("hamb"); if (h) h.setAttribute("aria-expanded", "false");
    return;
  }
  const sheet = e.target.closest("[data-navsheet]");
  if (sheet) {
    const nav = document.getElementById("nav");
    const open = nav.classList.toggle("sheetopen");
    sheet.setAttribute("aria-expanded", String(open));
    return;
  }
  const go = e.target.closest(".nav-list [data-go]");
  if (go) { const nav = document.getElementById("nav"); nav.classList.remove("sheetopen"); const b = nav.querySelector("[data-navsheet]"); if (b) b.setAttribute("aria-expanded", "false"); }
  if (!e.target.closest(".hmenu") && !document.getElementById("hamb")?.contains(e.target)) {
    const top = document.querySelector(".top");
    if (top) top.classList.remove("menuopen");
    const h = document.getElementById("hamb"); if (h) h.setAttribute("aria-expanded", "false");
  }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (TP) { closeTpop(); return; } if (document.getElementById("layer").innerHTML) closeLayer(); });
document.addEventListener("input", e => { const el = e.target; if (el.classList && el.classList.contains("err")) { el.classList.remove("err"); el.removeAttribute("aria-invalid"); const er = document.getElementById(el.id + "-e"); if (er) er.remove(); } });
document.addEventListener("input", e => { const m = (e.target.id || "").match(/^([ri])-(sur|name|pat|pos|pw|pw2)$/); if (!m) return; if (m[2].startsWith("pw")) pwRules(m[1]); else sigName(m[1], m[1] === "r" ? (S.reg.found ? S.reg.found.name : "") : "ООО «ТКР»"); });
document.getElementById("reset").addEventListener("click", () => { S = seed(); LOTS = false; BASE = null; closeLayer(); render(); toast("Демо-данные сброшены"); });
const gear = document.getElementById("gearBtn");
if (gear) {
  gear.addEventListener("click", e => {
